description: |
  Technically the first release by Eyhz under the techno only alias "Isobarikz".

  This album is a selection of tracks made in order to practice mixing techno.
  It has a focus on repetition and slowly adding and subtracking elements whilst keeping an ongoing groove so its good for easy listening such as studying or doing chores.

  Expect more Albums like this in the future whilst the Isobarikz project continues to expand into more high quality works

