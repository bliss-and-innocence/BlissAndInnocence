description: |
  A techno Ep produced over multiple months.

  It features multiple styles of techno, from minimal calming tracks to mainstage techno with sweeping basses and hard hitting grooves.

  It also contains 2 remixes by the amazing artists AIKATYPE & Violet Delta.

  We also had the help of the amazing mastering engineers at phantoms records (limited run) who did a great job at making this entire ep sounds amazing.
