description: |
  Sol Vacivus.

  The hollow sun that wanders the vast nothingness.
  The one who lost all purpose.
  The one who lies beyond existence.
  Consume. Assimilate.
  Nothing is but what is not

  Stored within its voided 'core', is the collective 'memory' of everything that is no longer.
  To project itself onto the material world.
  In a desperate attempt to record, store, and protect everything that is gone...

  He denied himself of his own existance.
  And thus born was the hollow sun - Sol Vacivus.

  'Procumbens Onte Sol Vacivus, Omnia Sacrificare'
  Speaks the matyr.

  The first non owner or compilation release on B&I, Dokusou Amane debuts with 12 original tracks and one feature of Eyhz on this album filled with melachonic melodies, hard kicks and dripping with atmosphere.

