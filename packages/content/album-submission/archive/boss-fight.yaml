name: Boss Fight
description: |
  After finally concluding our trance album Synthetic Protocol, it’s time to start our next compilation!

  This compilation will be focusing on:
  
  Anything you would hear in an action movie/climatic ending/boss fight
  
  You can make any genre as long as the song follows the prompt.
  
  Pricing: Free release
  
  For ideas see this playlist: https://youtube.com/playlist?list=PLjIeIbL4ct18SdfVyw2efEtkCVuA0B4og&si=AWVwb4XoABRaoiuz

  We hope that this prompt gives people the chance to make something cool in the genres or styles that they're the most comfortable with.
deadline: 2026-03-01
