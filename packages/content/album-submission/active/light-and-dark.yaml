name: Light and Dark
description: |
  We are happy to announce the theme of our next compilation: Light and Dark!

  With this theme we want to give artists of all styles the chance to make music that fits either of these themes. 
  Genre wise all genres are allowed, as long as they fit the theme.

  People are allowed to send up to two tracks each with one for light and dark each.
deadline: 2026-08-31
submission-link: https://forms.gle/vkFagNFxKEPcJgko8
