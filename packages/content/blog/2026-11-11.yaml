announcer: Eyhz
message: |
  NEW PROJECTS ANNOUNCEMENT!!
  After the success of Nox and Lux we are happy to announce a new project everyone can participate in (or 3 👀 )
  
  B&I COMP 1: Artcore & Botanica
    Deadline: April 1st
    Submission Link: TBA
    You can find more info in our [Discord Server](https://discord.com/invite/MGF6M3keNg) #artcore-botanica for more information
    
    For this release we are aiming to make a compilation on two lesser known genres: Artcore and Botanica.
      We will accept any tracks that fit these styles (Or better yet, a combination of the two).
      For this project we are not looking for a specific BPM, please make it how you would like!
  
  B&I COMP 2: Hard with Soul 2 (Electric Boogaloo)
    Deadline: April 1st
    Submission Link: TBA
    You can find more info in our [Discord Server](https://discord.com/invite/MGF6M3keNg) #hard-with-soul-2 for more information
  
    For this release we are returning to one of our first compilations: Hard with soul!
      Hardcore, hardstyle, Gabber, Uk Hardcore, Breakcore, Noise etc etc etc, If it makes your neighbours mad we want it!
      For more information check out the previous release!
      For this compilation we are looking for the specific bpm: Fast (150+)
  
  Xenodigit Records Compilation: Ambient Techno
    Deadline: February 1st
    Submission Link: TBA
    You can find more info in our [Discord Server](https://discord.com/invite/MGF6M3keNg) #ambient-techno for more information
    
    Ambiance, basslines and pads, we want to create a compilation that is based on nice pads, reverbed plucks and ambiance! With some nice drums accompying it for additional rytmn!
    For this project we are looking for a lower BPM, between 115-130
    
    Further Information to be added later in the correct channels